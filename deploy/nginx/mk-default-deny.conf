# Nginx — serveur PAR DÉFAUT (audit S-12 du 22/11/2026).
# Toute requête dont le nom d'hôte ne correspond à aucun site configuré (adresse IP seule, domaine inconnu,
# en-tête Host forgé) est refusée sans réponse, au lieu d'être servie par le premier site venu.
# À installer UNE fois par serveur : /etc/nginx/sites-available/00-default-deny.conf + lien dans sites-enabled,
# puis « nginx -t && systemctl reload nginx ». Aucun certificat nécessaire (poignée de main TLS refusée).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
