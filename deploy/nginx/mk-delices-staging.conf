# Nginx — MK Délices PRÉPRODUCTION. Dérivé de mk-delices.conf, avec en plus :
#  - accès protégé par mot de passe (htpasswd), y compris l'API ;
#  - en-tête X-Robots-Tag noindex (jamais indexé).
# Placeholders __DOMAIN__ et __PHPV__ (version de PHP-FPM) remplacés à l'installation.
# Dossier DISTINCT de la production (/var/www/mk-delices-staging) : déploiement avec APP_DIR=/var/www/mk-delices-staging.

limit_req_zone $binary_remote_addr zone=mk_api_staging:10m rate=10r/s;
# Journaux sans chaîne de requête (elle peut contenir un jeton de suivi de commande).
log_format mk_privacy_staging '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    # Renouvellement automatique du certificat (certbot --webroot -w /var/www/html) : jamais redirigé.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    # Tout le reste du trafic HTTP est redirigé vers HTTPS (SEC-001).
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/mk-delices-staging/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;   # téléversement d'images (6 Mo max côté Laravel)
    server_tokens off;

    # Compression (audit M17) : JS, CSS, JSON de l'API et SVG transférés compressés (mobiles 3G/4G).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Préproduction : accès réservé — identifiants (équipe de validation) OU adresse IP autorisée
    # (application mobile : son jeton « Bearer » occupe l'en-tête Authorization, incompatible avec le mot de passe).
    satisfy any;
    # allow 203.0.113.10;   # IP publique de l'équipe mobile (une ligne par adresse)
    deny all;
    auth_basic "MK Delices - preproduction";
    auth_basic_user_file /etc/nginx/mk-delices-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # En-têtes de sécurité (SEC-012). La CSP autorise uniquement les ressources réellement utilisées
    # par le SPA (Google Fonts, images locales, liens wa.me ouverts dans un nouvel onglet).
    include /etc/nginx/snippets/mk-security-headers.conf;

    # Fichiers statiques du build Vite (noms hachés → cache long).
    location /assets/ {
        alias /var/www/mk-delices-staging/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/mk-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }
    location = /favicon.svg {
        alias /var/www/mk-delices-staging/frontend/dist/favicon.svg;
        expires 7d;
    }
    # Service worker de l'espace livreur (notifications « nouvelle mission ») : jamais mis en cache, pour que
    # les mises à jour soient prises immédiatement.
    location = /sw.js {
        alias /var/www/mk-delices-staging/frontend/dist/sw.js;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/mk-security-headers.conf;
    }
    location = /livreur.webmanifest {
        alias /var/www/mk-delices-staging/frontend/dist/livreur.webmanifest;
        default_type application/manifest+json;
        expires 1d;
    }

    # Médias produits (images WebP ré-encodées) : jamais d'exécution de script.
    location /storage/ {
        try_files $uri =404;
        expires 30d;
        location ~* \.(php|phtml|phar)$ { deny all; }
    }

    # API, authentification, webhooks : PHP-FPM + limitation de débit au niveau Nginx.
    location ~ ^/(api|sanctum)/ {
        limit_req zone=mk_api_staging burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Toutes les autres URL : SpaController sert index.html avec les métadonnées SEO.
    # Santé de l'application : accessible sans mot de passe (supervision externe, tests de fumée).
    # /health n'expose que des indicateurs techniques (aucune donnée personnelle).
    # Passage DIRECT à PHP-FPM : un try_files vers /index.php repasserait par « location ~ \.php$ », soumise au
    # mot de passe du serveur, et la sonde recevrait 401.
    location ~ ^/(health|up)$ {
        allow all;
        auth_basic off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Pas d'accès aux fichiers cachés (.env, .git…).
    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/mk-delices-staging.access.log mk_privacy_staging;
    error_log  /var/log/nginx/mk-delices-staging.error.log warn;
}
