# Nginx — MK Délices (Debian/Ubuntu). À adapter : server_name, chemins, version de PHP-FPM.
# Topologie : docs/DEV-ARCHITECTURE.md §4. Certificat : certbot --nginx -d exemple.sn -d www.exemple.sn
# Hypothèses : code dans /var/www/mk-delices (backend/ et frontend/dist/), PHP-FPM 8.4.

limit_req_zone $binary_remote_addr zone=mk_api:10m rate=10r/s;
# Journaux sans chaîne de requête (elle peut contenir un jeton de suivi de commande).
log_format mk_privacy '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name exemple.sn www.exemple.sn;
    # Renouvellement automatique du certificat (certbot --webroot -w /var/www/html) : jamais redirigé.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    # Tout le reste du trafic HTTP est redirigé vers HTTPS (SEC-001).
    location / {
        return 301 https://exemple.sn$request_uri;
    }
}

# www en HTTPS → domaine principal (une seule adresse canonique ; certificat : certbot -d exemple.sn -d www.exemple.sn).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.exemple.sn;
    ssl_certificate     /etc/letsencrypt/live/exemple.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.sn/privkey.pem;
    return 301 https://exemple.sn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name exemple.sn;

    ssl_certificate     /etc/letsencrypt/live/exemple.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.sn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/mk-delices/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;   # téléversement d'images (6 Mo max côté Laravel)
    server_tokens off;

    # Compression (audit M17) : JS, CSS, JSON de l'API et SVG transférés compressés (mobiles 3G/4G).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # En-têtes de sécurité (SEC-012). La CSP autorise uniquement les ressources réellement utilisées
    # par le SPA (Google Fonts, images locales, liens wa.me ouverts dans un nouvel onglet).
    include /etc/nginx/snippets/mk-security-headers.conf;

    # Fichiers statiques du build Vite (noms hachés → cache long).
    location /assets/ {
        alias /var/www/mk-delices/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/mk-security-headers.conf;
        access_log off;
    }
    location = /favicon.svg {
        alias /var/www/mk-delices/frontend/dist/favicon.svg;
        expires 7d;
    }

    # Médias produits (images WebP ré-encodées) : jamais d'exécution de script.
    location /storage/ {
        try_files $uri =404;
        expires 30d;
        location ~* \.(php|phtml|phar)$ { deny all; }
    }

    # API, authentification, webhooks : PHP-FPM + limitation de débit au niveau Nginx.
    location ~ ^/(api|sanctum)/ {
        limit_req zone=mk_api burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Toutes les autres URL : SpaController sert index.html avec les métadonnées SEO.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Pas d'accès aux fichiers cachés (.env, .git…).
    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/mk-delices.access.log mk_privacy;
    error_log  /var/log/nginx/mk-delices.error.log warn;
}
