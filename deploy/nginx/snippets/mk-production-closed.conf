# Production FERMÉE au public (avant la décision go/no-go) : accès réservé à l'équipe MK Délices.
# À copier dans /etc/nginx/snippets/. Identifiants : /etc/nginx/mk-delices.htpasswd (htpasswd -B),
# mot de passe conservé dans /etc/mk-delices/production_access_password (root, 600).
# L'application mobile (jeton « Bearer » dans l'en-tête Authorization) passe par une IP autorisée.
satisfy any;
# allow 203.0.113.10;   # IP publique autorisée sans mot de passe (une ligne par adresse)
deny all;
auth_basic "MK Delices - bientot en ligne";
auth_basic_user_file /etc/nginx/mk-delices.htpasswd;
add_header X-Robots-Tag "noindex, nofollow" always;
