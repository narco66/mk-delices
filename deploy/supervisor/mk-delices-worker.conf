# Supervisor — worker de file d'attente (confirmation des paiements, emails).
# Installation : mkdir -p /var/log/mk-delices && chown www-data /var/log/mk-delices, copier dans /etc/supervisor/conf.d/
# puis `supervisorctl reread && supervisorctl update`. Préproduction : copie avec /var/www/mk-delices-staging et un autre nom de programme.
[program:mk-delices-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mk-delices/backend/artisan queue:work --sleep=3 --tries=6 --timeout=60 --memory=192 --max-time=3600
directory=/var/www/mk-delices/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90           # > --timeout : laisse finir la tâche en cours sans bloquer un redémarrage (audit M16)
redirect_stderr=true
stdout_logfile=/var/log/mk-delices/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
