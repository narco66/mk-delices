# Supervisor — worker de file d'attente (confirmation des paiements, emails).
# Installation : copier dans /etc/supervisor/conf.d/ puis `supervisorctl reread && supervisorctl update`.
[program:mk-delices-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mk-delices/backend/artisan queue:work --sleep=3 --tries=6 --max-time=3600
directory=/var/www/mk-delices/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/mk-delices/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
