openapi: 3.1.0
info:
  title: MK Délices API
  version: 1.0.0
  description: Contrat initial de cadrage, à compléter et valider avant implémentation.
servers:
- url: https://example.invalid/api/v1
  description: URL fictive à remplacer
tags:
- name: Catalog
- name: Checkout
- name: Payment
- name: Orders
- name: Delivery
- name: Admin
- name: Mobile
  description: Authentification de l'application mobile par jeton Bearer (voir docs/API-MOBILE.md)
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
    trackingToken:
      type: apiKey
      in: header
      name: X-Tracking-Token
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Application mobile : jeton d'accès par appareil obtenu via POST /auth/token (ou /auth/register avec
        device_name). En-tête « Authorization: Bearer <jeton> ». Expire après 30 jours, révocable. Aucun cookie
        ni jeton CSRF requis. Accepté sur toutes les routes protégées, avec les mêmes permissions que la session web.
    cartToken:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: Accompagne X-Cart-Id (identifiant du panier) sur les routes /cart et /checkout.
  schemas:
    AuthUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: [string, 'null']}
        roles: {type: array, items: {type: string, enum: [admin, commercial, preparateur, resp_livraison, livreur, client]}}
        permissions: {type: array, items: {type: string}}
        is_staff: {type: boolean}
        is_courier: {type: boolean}
        customer:
          type: [object, 'null']
          properties:
            id: {type: string, format: uuid}
            first_name: {type: string}
            last_name: {type: [string, 'null']}
            phone: {type: string}
            marketing_consent: {type: boolean}
    MobileToken:
      type: object
      properties:
        data:
          type: object
          required: [token, token_type, user]
          properties:
            token: {type: string, description: À conserver dans le stockage sécurisé de l'appareil (Keychain / Keystore)}
            token_type: {const: Bearer}
            expires_at: {type: [string, 'null'], format: date-time}
            user: {$ref: '#/components/schemas/AuthUser'}
    Error:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
        payment_status:
          type: string
        total_xof:
          type: integer
          minimum: 0
        currency:
          const: XOF
paths:
  /catalog/categories:
    get:
      summary: Liste catégories actives
      operationId: GET__catalog_categories
      tags:
      - Catalog
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
      x-access-role: Public
  /catalog/products:
    get:
      summary: Recherche/filtre produits disponibles
      operationId: GET__catalog_products
      tags:
      - Catalog
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
      x-access-role: Public
  /catalog/products/{slug}:
    get:
      summary: Fiche détaillée
      operationId: GET__catalog_products__slug_
      tags:
      - Catalog
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Résultat 404
          content:
            application/json:
              schema:
                type: object
      x-access-role: Public
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
  /cart:
    post:
      summary: Création panier
      operationId: POST__cart
      tags:
      - Checkout
      responses:
        '201':
          description: Résultat 201
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Résultat 422
          content:
            application/json:
              schema:
                type: object
      x-access-role: Invité/client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /cart/items/{id}:
    patch:
      summary: Mettre à jour quantité
      operationId: PATCH__cart_items__id_
      tags:
      - Checkout
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
      x-access-role: Propriétaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /checkout/quote:
    post:
      summary: Devis, zone, créneau
      operationId: POST__checkout_quote
      tags:
      - Checkout
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Résultat 422
          content:
            application/json:
              schema:
                type: object
      x-access-role: Invité/client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /checkout/orders:
    post:
      summary: Confirmer commande idempotente
      operationId: POST__checkout_orders
      tags:
      - Orders
      responses:
        '201':
          description: Résultat 201
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Résultat 422
          content:
            application/json:
              schema:
                type: object
      x-access-role: Invité/client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /orders/{ref}/payments:
    post:
      summary: Initier PSP
      operationId: POST__orders__ref__payments
      tags:
      - Payment
      responses:
        '201':
          description: Résultat 201
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
      x-access-role: Propriétaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
  /orders/{ref}/status:
    get:
      summary: Suivi public restreint
      operationId: GET__orders__ref__status
      tags:
      - Orders
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Résultat 403
          content:
            application/json:
              schema:
                type: object
      x-access-role: Jeton secret
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
  /orders/{ref}/whatsapp-draft:
    post:
      summary: Préparer message WhatsApp
      operationId: POST__orders__ref__whatsapp_draft
      tags:
      - Orders
      responses:
        '201':
          description: Résultat 201
          content:
            application/json:
              schema:
                type: object
      x-access-role: Propriétaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
  /webhooks/payments/{provider}:
    post:
      summary: Recevoir événement vérifié
      operationId: POST__webhooks_payments__provider_
      tags:
      - Payment
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Résultat 400
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Résultat 401
          content:
            application/json:
              schema:
                type: object
      x-access-role: Prestataire signé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
  /auth/login:
    post:
      summary: Créer session
      operationId: POST__auth_login
      tags:
      - Checkout
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Résultat 401
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Résultat 429
          content:
            application/json:
              schema:
                type: object
      x-access-role: Staff/livreur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /auth/logout:
    post:
      summary: Fermer session
      operationId: POST__auth_logout
      tags:
      - Checkout
      responses:
        '204':
          description: Résultat 204
          content:
            application/json:
              schema:
                type: object
      x-access-role: Authentifié
      description: Session web fermée ; avec un jeton Bearer, seul le jeton de cet appareil est révoqué.
      security:
      - sessionCookie: []
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /auth/token:
    post:
      summary: Application mobile — obtenir un jeton d'accès pour cet appareil
      operationId: POST__auth_token
      tags:
      - Mobile
      x-access-role: Tout compte actif (client, livreur, équipe)
      description: >-
        Limité à 5 tentatives par minute et par email (20 par adresse IP). Le jeton en clair n'est renvoyé
        qu'une fois ; il est stocké haché côté serveur. Au-delà de 10 appareils, les plus anciens sont déconnectés.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: {type: string, format: email, maxLength: 160}
                password: {type: string, maxLength: 200}
                device_name: {type: string, minLength: 2, maxLength: 100, example: iPhone de Fatou}
      responses:
        '201':
          description: Jeton émis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileToken'
        '401': {description: Identifiants incorrects (code invalid_credentials), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Compte désactivé (code account_disabled), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Champ manquant ou invalide, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Trop de tentatives, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/register:
    post:
      summary: Créer un compte client (avec device_name, renvoie un jeton mobile)
      operationId: POST__auth_register
      tags:
      - Mobile
      x-access-role: Public (rôle client uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, phone, password, password_confirmation, accepted_privacy]
              properties:
                first_name: {type: string, minLength: 2, maxLength: 80}
                last_name: {type: string, maxLength: 80}
                email: {type: string, format: email}
                phone: {type: string, description: Numéro sénégalais, example: 77 123 45 67}
                password: {type: string, minLength: 10, description: Lettres et chiffres}
                password_confirmation: {type: string}
                accepted_privacy: {type: boolean, const: true}
                marketing_consent: {type: boolean}
                device_name: {type: string, description: "Si présent, un jeton mobile est renvoyé au lieu d'une session web"}
      responses:
        '201':
          description: Compte créé (jeton si device_name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileToken'
        '422': {description: "Email déjà utilisé, téléphone ou mot de passe invalide", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/me:
    get:
      summary: Utilisateur connecté, rôles et permissions
      operationId: GET__auth_me
      tags:
      - Mobile
      security:
      - sessionCookie: []
      - bearerAuth: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AuthUser'}
        '401': {description: Non authentifié ou jeton expiré/révoqué, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/tokens:
    get:
      summary: Appareils connectés (jetons actifs)
      operationId: GET__auth_tokens
      tags:
      - Mobile
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Liste des appareils
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        device_name: {type: string}
                        last_used_at: {type: [string, 'null'], format: date-time}
                        expires_at: {type: [string, 'null'], format: date-time}
                        created_at: {type: string, format: date-time}
                        current: {type: boolean, description: Jeton utilisé pour cette requête}
  /auth/tokens/{id}:
    delete:
      summary: Déconnecter un appareil (ex. téléphone perdu)
      operationId: DELETE__auth_tokens_id
      tags:
      - Mobile
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Appareil déconnecté}
        '404': {description: Jeton inconnu ou appartenant à un autre compte, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /admin/orders:
    get:
      summary: Liste paginée
      operationId: GET__admin_orders
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Résultat 403
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
  /admin/orders/{id}:
    get:
      summary: Détail et journal
      operationId: GET__admin_orders__id_
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Résultat 403
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Résultat 404
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/orders/{id}/transitions:
    post:
      summary: Transition validée
      operationId: POST__admin_orders__id__transitions
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Résultat 422
          content:
            application/json:
              schema:
                type: object
      x-access-role: Acteur autorisé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/products:
    get:
      summary: Lister y compris inactifs
      operationId: GET__admin_products
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
    post:
      summary: Créer produit
      operationId: POST__admin_products
      tags:
      - Admin
      responses:
        '201':
          description: Résultat 201
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Résultat 422
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /admin/products/{id}:
    patch:
      summary: Modifier produit
      operationId: PATCH__admin_products__id_
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/delivery/zones:
    get:
      summary: Zones et frais
      operationId: GET__admin_delivery_zones
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
      x-access-role: Responsable/admin
  /admin/delivery/assignments:
    post:
      summary: Affecter mission
      operationId: POST__admin_delivery_assignments
      tags:
      - Admin
      responses:
        '201':
          description: Résultat 201
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
      x-access-role: Responsable/admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /courier/missions:
    get:
      summary: Mes missions uniquement
      operationId: GET__courier_missions
      tags:
      - Delivery
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Résultat 403
          content:
            application/json:
              schema:
                type: object
      x-access-role: Livreur
  /courier/missions/{id}/actions:
    post:
      summary: Accepter, enlever, livrer, échec
      operationId: POST__courier_missions__id__actions
      tags:
      - Delivery
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Résultat 409
          content:
            application/json:
              schema:
                type: object
      x-access-role: Livreur affecté
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/stats:
    get:
      summary: Agrégats filtrés
      operationId: GET__admin_stats
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Résultat 403
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
  /admin/payments:
    get:
      summary: Rapprochement paiement
      operationId: GET__admin_payments
      tags:
      - Admin
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Résultat 403
          content:
            application/json:
              schema:
                type: object
      x-access-role: Commercial/admin
