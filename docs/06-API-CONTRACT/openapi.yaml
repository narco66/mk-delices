openapi: 3.1.0
info:
  title: MK Délices API
  version: 1.0.0
  description: Contrat initial de cadrage, à compléter et valider avant implémentation.
servers:
- url: https://example.invalid/api/v1
  description: URL fictive à remplacer
tags:
- name: Catalog
- name: Checkout
- name: Payment
- name: Orders
- name: Delivery
- name: Admin
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
    trackingToken:
      type: apiKey
      in: header
      name: X-Tracking-Token
  schemas:
    Error:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
        payment_status:
          type: string
        total_xof:
          type: integer
          minimum: 0
        currency:
          const: XOF
paths:
  /catalog/categories:
    get:
      summary: Liste catégories actives
      operationId: GET__catalog_categories
      tags:
      - Catalog
      responses:
        '200':
          description: Résultat 200
          content:
            application/json:
              schema:
                type: object
      x-access-role: Public
  /catalog/products:
    get:
      summary: Recherche/filtre produits disponibles
      operationId: GET__catalog_products
